<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Alur: Algoritma, Logika, Uji, Rancang</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="alur-icon.svg">
<style>
@font-face{font-family:"Baloo 2";src:url("fonts/baloo2-variable.ttf") format("truetype");font-style:normal;font-weight:600 800;font-display:swap}
@font-face{font-family:Nunito;src:url("fonts/nunito-variable.ttf") format("truetype");font-style:normal;font-weight:600 700;font-display:swap}
:root{--bg:#f2f6fb;--card:#fff;--tx:#14213d;--mu:#55627a;--pr:#1f6fe5;--ln:#d5deec;--ok:#14935a;--okbg:#d9f5e7;--no:#d03b3b;--nobg:#fde6e6;--ac:#ffc233;--hd:#14213d;--hdt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#1a2338;--tx:#eaf0fb;--mu:#a3b0c8;--pr:#6aa3ff;--ln:#2f3b57;--ok:#53d69a;--okbg:#14382a;--no:#ff7b7b;--nobg:#3d1f24;--hd:#0a1020;--hdt:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#1a2338;--tx:#eaf0fb;--mu:#a3b0c8;--pr:#6aa3ff;--ln:#2f3b57;--ok:#53d69a;--okbg:#14382a;--no:#ff7b7b;--nobg:#3d1f24;--hd:#0a1020;--hdt:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:700 17px/1.5 Nunito,system-ui,sans-serif;background:var(--bg)}
header{background:var(--hd);color:var(--hdt);padding:18px 16px 12px}
h1{font:800 26px/1.2 "Baloo 2",system-ui,sans-serif;margin:0}
header p{margin:2px 0 10px;color:#c9d6ee;font-weight:600;font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto}
.tab{flex:0 0 auto;border:0;border-radius:12px;padding:8px 14px;font:800 15px "Baloo 2",system-ui,sans-serif;background:#2a3a5e;color:#fff;cursor:pointer}
.tab.on{background:var(--ac);color:#14213d}
.tab.dn::after{content:" ⭐"}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:14px}
h2{font:800 21px/1.3 "Baloo 2",system-ui,sans-serif;margin:0 0 4px}
.mu{color:var(--mu);font-weight:600;font-size:15px;margin:0}
ol.k{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
ol.k li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);border:2px dashed var(--ln);cursor:pointer;user-select:none}
ol.k li b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:15px}
ol.k li.dn{opacity:.55;text-decoration:line-through}
.kt{flex:1;display:grid;gap:4px}
.vz{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vz i{font-style:normal;font-weight:700;font-size:15px;background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:2px 8px}
.vz u{text-decoration:none;font-weight:800;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.vz u.y{background:var(--ok)}.vz u.n{background:var(--no)}
ol.k li.sel{border:2px solid var(--ac);background:var(--card)}
.ck{border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 10px;font:800 13px "Baloo 2",system-ui,sans-serif;cursor:pointer}
.hl{box-shadow:inset 0 0 0 40px rgba(255,194,51,.4)}
.hl2{outline:4px solid var(--ac);outline-offset:1px}
.gt{font:800 16px "Baloo 2",system-ui,sans-serif;margin:10px 0 6px}
.sc{overflow-x:auto;padding-bottom:4px}
table{border-collapse:separate;border-spacing:6px}
th{font-weight:800;font-size:14px;color:var(--mu);padding:2px 4px;min-width:66px;vertical-align:bottom}
th.r{text-align:left;color:var(--tx);font-size:16px;white-space:nowrap}
.e{display:block;font-size:26px;line-height:1.1}
.cell{width:64px;height:64px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:800 30px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.cell:focus-visible,.btn:focus-visible,.tab:focus-visible,ol.k li:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.c1{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.c2{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bad{outline:4px solid var(--no);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:800 16px "Baloo 2",system-ui,sans-serif;background:var(--pr);color:#fff;cursor:pointer}
.btn.s{background:var(--card);color:var(--tx);border:2px solid var(--ln)}
.btn.g{background:var(--ok);color:#fff}
.msg{min-height:26px;margin:10px 0 0;font-weight:700}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.win{display:none;border-color:var(--ok);background:var(--okbg);animation:pop .4s}
.win.on{display:block}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.ans{display:grid;gap:6px;margin:8px 0}
.ans div{background:var(--card);border-radius:12px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){.bad,.win{animation:none}}
.tabs+.tabs{margin-top:8px}
.tb{background:var(--ac);color:#14213d;border-radius:16px;padding:10px 16px;margin-bottom:14px;font:800 20px/1.3 "Baloo 2",system-ui,sans-serif;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:center}
.tb small{font:700 14px Nunito,system-ui,sans-serif}
details summary{cursor:pointer;font:800 18px "Baloo 2",system-ui,sans-serif}
@media (min-width:900px){body{font-size:19px}main{max-width:1440px}#play:not([hidden]){display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);column-gap:16px;align-items:start}.tb,#how,#wn{grid-column:1/-1}.cell{width:84px;height:84px;font-size:40px}th{min-width:84px;font-size:16px}.e{font-size:34px}th.r{font-size:19px}}

.gr{border-collapse:separate;border-spacing:4px}
.gr td{width:58px;height:58px;border-radius:12px;background:var(--card);border:2px solid var(--ln);text-align:center;font-size:28px;padding:0}
.gr td.ob{background:#e5c79b}.gr td.fn{background:var(--okbg);border-color:var(--ok)}
.gr td small{font:800 11px Nunito,system-ui,sans-serif;color:var(--mu)}
.rb{position:relative;display:inline-block}
.rb i{position:absolute;right:-10px;top:-10px;font-style:normal;font-size:14px;line-height:20px;width:20px;height:20px;border-radius:50%;background:var(--pr);color:#fff;transition:transform .2s;text-align:center}
.pg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.pc{min-width:56px;height:52px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:800 18px Nunito,system-ui,sans-serif;cursor:pointer;padding:0 12px}
.pc:disabled{opacity:.45;cursor:not-allowed}
.pc.sel{outline:4px solid var(--ac)}.pc.bad{border-color:var(--no);background:var(--nobg)}.pc.em{border-style:dashed;color:var(--mu);font-size:14px}
.sl{display:grid;gap:8px;margin:8px 0;padding:0;list-style:none}
.sl button{width:100%;text-align:left;min-height:52px;border-radius:12px;border:2px dashed var(--ln);background:var(--bg);color:var(--tx);font:700 17px Nunito,system-ui,sans-serif;padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sl button.bad{border-color:var(--no);background:var(--nobg)}
.sl b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center}
.bk{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bk button{border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;font:700 17px Nunito,system-ui,sans-serif;cursor:pointer}
.lb{font:800 15px "Baloo 2",system-ui,sans-serif;margin:10px 0 2px;color:var(--mu)}
@media (min-width:900px){.gr td{width:84px;height:84px;font-size:38px}.pc{height:60px;font-size:22px}.split-groups{grid-template-columns:repeat(3,minmax(0,1fr))}}

.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.brand .sub{color:#c9d6ee;font-weight:600;font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.map{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.split-groups{display:grid;gap:10px;margin:10px 0}
.split-group{display:grid;gap:6px;border:2px solid var(--ln);border-radius:14px;padding:10px}
.split-group h3{font:800 17px "Baloo 2",system-ui,sans-serif;margin:0}
.split-slot{min-height:48px;text-align:left;border:2px dashed var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:700 15px Nunito,system-ui,sans-serif;padding:8px 10px}
.split-slot.ready{border-color:var(--pr);cursor:pointer}
.split-slot b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pr);color:#fff;margin-right:4px}
.pattern-seq{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:32px;margin:12px 0}
.pattern-seq span{display:grid;place-items:center;min-width:48px;height:52px;border:2px solid var(--ln);border-radius:12px;background:var(--card)}
.pattern-seq span:last-child{border-style:dashed;color:var(--pr)}
.rule-box{margin:14px 0;padding:14px;border:2px solid var(--ln);border-radius:16px;background:var(--bg)}
.rule-box h3{margin:0 0 6px;font:800 19px "Baloo 2",system-ui,sans-serif}
.rule-row{margin:10px 0}
.rule-row>b{display:block;margin-bottom:4px}
.rule-test{margin:0 4px 4px 0}
.rule-result{display:inline-block;font-size:14px;font-weight:700;margin:4px 8px}
.rule-result.ok{color:var(--ok)}.rule-result.no{color:var(--no)}
.ab-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:10px 0}
.ab-option{display:flex;align-items:center;gap:10px;min-height:54px;text-align:left;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);padding:10px 12px;font:700 16px Nunito,system-ui,sans-serif;cursor:pointer}
.ab-option.sel{border-color:var(--pr);background:var(--okbg)}
.ab-option:focus-visible,.flow-slot:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.ab-mark{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:8px;background:var(--bg);font-weight:800}
.flowchart{display:grid;justify-items:center;gap:8px;margin:12px auto;padding:12px;border:2px solid var(--ln);border-radius:16px;background:var(--bg)}
.flow-node,.flow-slot{max-width:100%;min-width:180px;padding:10px 14px;border:2px solid var(--pr);border-radius:14px;background:var(--card);color:var(--tx);text-align:center;font:800 16px/1.3 "Baloo 2",system-ui,sans-serif}
.flow-slot{border-style:dashed;cursor:pointer}
.flow-arrow{color:var(--pr);font-weight:800;font-size:20px;line-height:1}
.flow-branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;align-items:start}
.flow-branches>div{display:grid;justify-items:center;gap:6px;min-width:0}
.flow-branches .pg{justify-content:center}
.ab-cases{display:grid;gap:8px;margin:8px 0}
.ab-case{border:2px solid var(--ln);border-radius:12px;padding:10px;background:var(--card)}
.ab-case>.pg{margin-bottom:0}
.route-option{display:grid;gap:6px;flex:1 1 100%;text-align:left;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);padding:8px 10px;font:700 15px Nunito,system-ui,sans-serif;cursor:pointer}
.route-option.sel{border-color:var(--pr);outline:3px solid var(--pr)}
.route-option:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.route-option b{font:800 16px "Baloo 2",system-ui,sans-serif}
.route-steps{display:flex;flex-wrap:wrap;gap:3px}
.route-step{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);font-weight:800}
.lv{text-align:left;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:18px;padding:14px;cursor:pointer;font:700 16px/1.4 Nunito,system-ui,sans-serif}
.lv:disabled{opacity:.5;cursor:not-allowed}.lv:focus-visible,.seg button:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.lv h3{font:800 20px/1.2 "Baloo 2",system-ui,sans-serif;margin:4px 0}
.lv .n{display:inline-block;background:var(--ac);color:#14213d;border-radius:10px;padding:0 10px;font:800 14px "Baloo 2",system-ui,sans-serif}
.lv .st{font-size:14px;color:var(--mu);font-weight:700}
.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--ln);margin:6px 4px 0 0}.dots i.on{background:var(--ok)}
select,input[type=text]{font:700 16px Nunito,system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx);max-width:100%}
.demo-details>summary{margin:-2px 0}
.demo-details[open]>summary{margin-bottom:8px}
.demo-details .mu{margin:0 0 8px}
.demo-scene{border:2px solid var(--ln);border-radius:14px;background:var(--bg);padding:12px;margin:8px 0;overflow:hidden}
.demo-scene b{font:800 15px "Baloo 2",system-ui,sans-serif}
.demo-step,.demo-chip,.demo-test,.demo-group,.demo-case,.demo-detail,.demo-compact{border:2px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);padding:8px 12px;font-weight:800;text-align:center}
.demo-sequence{display:grid;justify-items:center;gap:6px}
.demo-arrow{color:var(--pr);font-size:20px;line-height:1}
.demo-debug{display:grid;gap:10px}
.demo-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.demo-row>b{flex:1 0 100%;text-align:left}
.demo-chip{font-size:14px}
.demo-bug-chip{border-color:var(--no);background:var(--nobg)}
.demo-test{color:var(--no);border-color:var(--no)}
.demo-fix{border-top:2px dashed var(--ln);padding-top:10px}
.demo-fix .demo-chip:nth-child(3){border-color:var(--ok);background:var(--okbg)}
.demo-split{display:grid;gap:8px}
.demo-group{display:grid;gap:4px;text-align:left}
.demo-group span{font-size:14px;font-weight:700}
.demo-loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.demo-repeat-step{border:2px solid var(--ln);border-radius:8px;background:var(--card);padding:6px 10px;font-weight:800}
.demo-compact{border-color:var(--pr);color:var(--pr)}
.demo-flow{display:grid;justify-items:center;gap:10px}
.demo-condition{border:2px solid var(--pr);border-radius:12px;background:var(--card);padding:10px 14px;text-align:center;font-weight:800}
.demo-cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.demo-case{display:grid;gap:6px;font-size:14px}
.demo-yes{border-color:var(--ok)}
.demo-no{border-color:var(--ac)}
.demo-abstraction{display:grid;justify-items:center;gap:10px}
.demo-details{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.demo-detail{font-size:14px}
.demo-detail.keep{border-color:var(--ok)}
.demo-detail.discard{border-color:var(--no);color:var(--mu)}
.demo-filter{color:var(--pr)}
.demo-selection{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px}
.demo-selection span{border:2px solid var(--ok);border-radius:9px;background:var(--card);padding:6px 10px}
.demo-selection b{color:var(--pr)}
.demo-transcript{margin:0 0 8px;font-size:14px;color:var(--mu)}
.demo-replay{min-height:44px}
.demo-status{display:inline-block;margin-left:8px;color:var(--mu);font-size:14px}
.demo-scene.is-playing .demo-step{animation:demo-highlight .9s ease both}
.demo-sl.is-playing .demo-step:nth-of-type(1){animation-delay:.2s}
.demo-sl.is-playing .demo-step:nth-of-type(2){animation-delay:1.2s}
.demo-sl.is-playing .demo-step:nth-of-type(3){animation-delay:2.2s}
.demo-pb.is-playing .demo-test{animation:demo-highlight .9s ease 1s both}
.demo-pb.is-playing .demo-bug-chip{animation:demo-shake .7s ease 2s both}
.demo-pb.is-playing .demo-fix{animation:demo-highlight 1s ease 3s both}
.demo-pu.is-playing .demo-group:nth-child(1){animation-delay:.2s}
.demo-pu.is-playing .demo-group:nth-child(2){animation-delay:1.2s}
.demo-pu.is-playing .demo-repeat-step{animation:demo-highlight .8s ease 2.5s both}
.demo-pu.is-playing .demo-repeat-step:nth-child(2){animation-delay:2.9s}
.demo-pu.is-playing .demo-repeat-step:nth-child(3){animation-delay:3.3s}
.demo-pu.is-playing .demo-repeat-step:nth-child(4){animation-delay:3.7s}
.demo-pu.is-playing .demo-compact{animation:demo-highlight 1s ease 4.4s both}
.demo-dt.is-playing .demo-condition{animation:demo-highlight .9s ease .2s both}
.demo-dt.is-playing .demo-yes{animation:demo-highlight .9s ease 1.4s both}
.demo-dt.is-playing .demo-no{animation:demo-highlight .9s ease 2.7s both}
.demo-ab.is-playing .demo-detail.keep{animation:demo-highlight .9s ease .5s both}
.demo-ab.is-playing .demo-detail.discard{animation:demo-fade 1.2s ease 1.8s both}
.demo-ab.is-playing .demo-selection{animation:demo-highlight 1s ease 3.2s both}
.demo-maker{display:grid;justify-items:center;gap:12px}
.demo-mini-grid{display:grid;grid-template-columns:repeat(3,44px);gap:4px;padding:8px;border:2px solid var(--ln);border-radius:12px;background:var(--card)}
.demo-mini-grid span{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--ln);border-radius:7px;background:var(--bg);font-weight:800}
.demo-mini-grid span:nth-child(6){background:var(--tx);color:var(--card)}
.demo-mini-grid span:nth-child(3){color:var(--ok)}
.demo-mini-grid span:nth-child(10){color:var(--pr)}
.demo-ra.is-playing .demo-mini-grid span:nth-child(6){animation:demo-highlight .8s ease .4s both}
.demo-ra.is-playing .demo-mini-grid span:nth-child(10){animation:demo-highlight .8s ease 1.3s both}
.demo-ra.is-playing .demo-mini-grid span:nth-child(3){animation:demo-highlight .8s ease 2.2s both}
.demo-ra.is-playing .demo-filter{animation:demo-highlight .8s ease 3.1s both}
.designer-grid{display:grid;grid-template-columns:repeat(5,minmax(42px,64px));justify-content:center;gap:5px;width:max-content;max-width:100%;margin:12px auto;padding:8px;border:2px solid var(--ln);border-radius:14px;background:var(--bg)}
.designer-cell{display:grid;place-items:center;width:clamp(42px,12vw,64px);height:clamp(42px,12vw,64px);border:2px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:800 12px Nunito,system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.designer-cell:not(.fixed):hover{border-color:var(--pr)}
.designer-cell:focus-visible{outline:3px solid var(--pr);outline-offset:1px}
.designer-cell.blocked{background:#e5c79b;border-color:#a97932;color:#5d3b12;font-size:21px}
.designer-cell.fixed{background:var(--okbg);border-color:var(--ok);color:var(--ok);cursor:default}
.designer-cell.occupied{font-size:23px}
.designer-robot{position:relative;display:grid;place-items:center}
.designer-robot i{position:absolute;top:-5px;right:-7px;font:800 13px system-ui,sans-serif;color:var(--pr)}
.designer-count{text-align:center;font-weight:800;color:var(--mu)}
.challenge-map{border-collapse:separate;border-spacing:3px;margin:6px auto}
.challenge-map td{width:26px;height:26px;border:1px solid var(--ln);border-radius:5px;text-align:center;background:var(--card);font-weight:800}
.challenge-map tr:first-child td:last-child,.challenge-map tr:last-child td:first-child{color:var(--ok)}
@keyframes demo-highlight{0%,100%{transform:scale(1);box-shadow:none}45%{transform:scale(1.05);box-shadow:0 0 0 4px var(--ac)}}
@keyframes demo-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes demo-fade{0%,100%{opacity:1}70%{opacity:.25;text-decoration:line-through}}
@media (prefers-reduced-motion:reduce){.demo-scene.is-playing *{animation:none!important}.demo-maker *{animation:none!important}}
@media (min-width:900px){.demo-cases{max-width:620px}}
[hidden]{display:none!important}
</style>
</head>

<script>var DR=[[-1,0],[0,1],[1,0],[0,-1]],IC={F:"⬆ Maju",L:"↰ Kiri",R:"↱ Kanan"};

},ST=load(),mod=null,v=0,cur=0,rot=0,S={},DN={},hi={},cache={},demoOpen=false;
function load(){var d;try{d=JSON.parse(localStorage.getItem("alur.v1"))}catch(e){}return d&&d.profiles?d:{mode:"kelas",profiles:[],active:null}}

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function profileDataValid(d){if(!d||d.format!=="alur-profiles"||d.version!==1||!Array.isArray(d.profiles))return false;
var ids=Object.create(null),valid=true;
d.profiles.forEach(function(p){if(!p||typeof p.id!="string"||!p.id||p.id.length>64||ids[p.id]||typeof p.nama!="string"||!p.nama.trim()||p.nama!==p.nama.trim()||p.nama.length>20||typeof p.v!="number"||p.v%1||p.v<0||p.v>2||!p.done||typeof p.done!="object"||Array.isArray(p.done)){valid=false;return}
ids[p.id]=1;Object.keys(p.done).forEach(function(id){var a=p.done[id];if(ORD.indexOf(id)<0||!Array.isArray(a)||a.some(function(n,i){return typeof n!="number"||n%1||n<0||n>3||a.indexOf(n)!=i}))valid=false})});
return valid&&(d.active===null||typeof d.active=="string"&&!!ids[d.active])}
function profileStatus(t,c){var el=$("profile-msg");if(el){el.textContent=t;el.className="msg "+(c||"")}}
function exportProfiles(){var data={format:"alur-profiles",version:1,profiles:ST.profiles,active:ST.active},url;
try{url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
var a=document.createElement("a");a.href=url;a.download="alur-profil.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},0);profileStatus("Profil siap disimpan.","ok")}
catch(e){profileStatus("Ekspor gagal. Coba lagi di peramban ini.","no")}}
function importProfiles(file){var reader=new FileReader();
reader.onload=function(){var data;try{data=JSON.parse(reader.result)}catch(e){profileStatus("Berkas tidak valid. Profil tidak berubah.","no");return}
if(!profileDataValid(data)){profileStatus("Format berkas tidak sesuai. Profil tidak berubah.","no");return}
if(ST.profiles.length&&!window.confirm("Impor akan mengganti semua profil dan progres di perangkat ini. Lanjutkan?")){profileStatus("Impor dibatalkan. Profil tidak berubah.");return}
var profiles=data.profiles.map(function(p){var done={};Object.keys(p.done).forEach(function(id){done[id]=p.done[id].slice()});return{id:p.id,nama:p.nama,v:p.v,done:done}});
var next={mode:ST.mode,profiles:profiles,active:data.active};
try{localStorage.setItem("alur.v1",JSON.stringify(next))}catch(e){profileStatus("Profil tidak dapat disimpan. Ruang penyimpanan mungkin penuh.","no");return}
ST=next;home();profileStatus("Profil dan progres berhasil diimpor.","ok")};
reader.onerror=function(){profileStatus("Berkas tidak dapat dibaca. Profil tidak berubah.","no")};
reader.readAsText(file)}
function prof(){return ST.profiles.filter(function(p){return p.id==ST.active})[0]||null}
function full(id){var p=prof();return !!(p&&p.done[id]&&p.done[id].length>=4)}
function locked(id){if(ST.mode!="mandiri")return false;if(!prof())return true;var i=ORD.indexOf(id);return i>0&&!full(ORD[i-1])}
function key(){return v*4+cur}
function ch(i){return (i+rot)%3+1}
function isDone(k){return !!DN[mod.id+":"+k]}
function pz(){var k=mod.id+":"+key();return cache[k]||(cache[k]=mod.P(cur,v))}
function st(){var k=mod.id+":"+key();return S[k]||(S[k]=mod.init(pz()))}

function actionText(){return mod.id=="sl"?"Cek / Jalankan":mod.id=="pb"||mod.id=="pu"&&cur==2||mod.id=="ra"?"Jalankan":"Cek jawaban"}
function fin(k,t,c,w){if(k==key())msg(t,c);if(w){DN[mod.id+":"+k]=1;if(ST.mode=="mandiri"&&prof()){var a=prof().done[mod.id]=prof().done[mod.id]||[];if(a.indexOf(k%4)<0)a.push(k%4);save()}}draw();if(w&&k==key())$("wn").scrollIntoView({behavior:"smooth",block:"nearest"})}
function home(){var p=prof(),m=ST.mode,h='<div class="card"><h2>Mode</h2><div class="seg"><button class="btn'+(m=="kelas"?'':' s')+'" data-md="kelas">Mode Kelas</button><button class="btn'+(m=="mandiri"?'':' s')+'" data-md="mandiri">Mode Mandiri</button></div><p class="mu">'+(m=="kelas"?"Satu perangkat di proyektor, anak maju bergiliran dengan 3 versi soal. Semua level terbuka.":"Siswa mengerjakan jalurnya sendiri di dalam kelas. Level dan misi terbuka satu per satu.")+'</p>';
if(m=="mandiri"){h+='<p class="lb">Siapa yang bermain?</p><div class="seg">'+(ST.profiles.length?'<select id="pf" aria-label="Pilih siswa">'+ST.profiles.map(function(x){return '<option value="'+x.id+'"'+(x.id==ST.active?' selected':'')+'>'+esc(x.nama)+'</option>'}).join("")+'</select>':'')+'<input type="text" id="pn" maxlength="20" placeholder="Nama panggilan" aria-label="Nama panggilan"><button class="btn" id="pa">Tambah siswa</button></div>'+(p?'<p class="mu">Versi soal untuk siswa ini: <b>'+V[p.v]+'</b></p>':'<p class="mu">Tambahkan siswa dulu untuk mulai.</p>')+'<div class="seg"><button class="btn s" id="pe">Ekspor profil</button><button class="btn s" id="pi">Impor profil</button><input type="file" id="profile-file" accept="application/json,.json" hidden></div><p class="mu" id="profile-msg" aria-live="polite"></p>'}
h+='</div><div class="map">'+LV.map(function(l){var off=!l.m||locked(l.m),d=(l.m&&p&&m=="mandiri")?(p.done[l.m]||[]):[];
return '<button class="lv" data-lv="'+(l.m||"")+'"'+(off?' disabled':'')+'><span class="n">Level '+l.n+'</span><h3>'+l.t+'</h3><div>'+l.s+'</div><div class="st">'+(l.m?NM[l.m]+(locked(l.m)?' · terkunci':' · tersedia'):'Segera hadir')+'</div>'+(l.m?'<div class="dots" aria-label="Misi selesai">'+[0,1,2,3].map(function(i){return '<i class="'+(d.indexOf(i)>-1?'on':'')+'"></i>'}).join("")+'</div>':'')+'</button>'}).join("")+'</div>';
$("home").innerHTML=h;show(0)}
function show(p){$("home").hidden=!!p;$("play").hidden=!p;$("vt").hidden=!p||ST.mode!="kelas";$("tabs").hidden=!p;if(!p)mod=null}
function openMod(id){mod=MODS[id];mod.id=id;var p=prof();DN={};S={};hi={};cur=0;rot=0;demoOpen=false;

function demoView(){var d=DEMO[mod.id],open=demoOpen?' open':'';return '<details class="demo-details"'+open+'><summary>Animasi konsep: '+d.title+'</summary><p class="mu">'+d.lead+'</p><div class="demo-scene demo-'+mod.id+'" aria-hidden="true">'+d.scene+'</div><p class="demo-transcript">'+d.alt+'</p><button class="btn s demo-replay" type="button" data-demo-replay>Putar ulang contoh</button><span class="demo-status" aria-live="polite"></span></details>'}

else nb.textContent=cur<3?"Misi berikutnya":"Kembali ke peta level";
